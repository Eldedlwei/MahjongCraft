name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --console=plain 2>&1 | tee gradle-build.log
          build_exit="${PIPESTATUS[0]}"
          if [ "$build_exit" -ne 0 ]; then
            {
              echo "Build failed. Last 120 lines:"
              tail -n 120 gradle-build.log
              echo ""
              echo "Key error lines:"
              grep -E "error:|FAILURE: Build failed|What went wrong|Execution failed|Could not resolve|Compilation failed" gradle-build.log | tail -n 20 || true
            } > build-failure-summary.txt

            summary="$(sed ':a;N;$!ba;s/\n/ | /g' build-failure-summary.txt | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error::$summary"
            exit "$build_exit"
          fi

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mahjongcraft-build-${{ github.run_number }}
          path: |
            gradle-build.log
            build-failure-summary.txt
            build/libs/*.jar
            build/reports/**
          if-no-files-found: ignore
